name: iOS IPA
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      server_url:
        description: "HTTPS URL of your hosted Monochrome web UI (optional)"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Build (unsigned)
        working-directory: ios
        run: |
          VER="${GITHUB_REF_NAME#v}"; case "$GITHUB_REF" in refs/tags/v*) ;; *) VER="1.0.0";; esac
          xcodebuild -project Monochrome.xcodeproj -scheme Monochrome -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MONO_URL="${{ github.event.inputs.server_url }}" \
            MARKETING_VERSION="$VER" CURRENT_PROJECT_VERSION="${{ github.run_number }}" build
      - name: Package IPA
        working-directory: ios
        run: |
          mkdir Payload && cp -R build/Build/Products/Release-iphoneos/Monochrome.app Payload/
          zip -qr Monochrome.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Monochrome-ipa
          path: ios/Monochrome.ipa
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ios/Monochrome.ipa
          generate_release_notes: true
